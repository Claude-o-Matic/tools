<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uhren-Spiel</title>
<meta name="tool-icon" content="🕒">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3F1EC; --surface:#FFFFFF; --ink:#1D3557; --soft:#56677F; --line:#C7D9E3;
  --btn:#F2F7FA; --btn-h:#E2EDF4; --ok:#23884F; --bad:#B9440F; --gold:#E8A900;
  --chip:#FFF3CC;
  /* Uhr bleibt in beiden Modi hell */
  --face:#FFFFFF; --face-ink:#1D3557; --tick:#9FB3C4; --hour:#E4572E; --minute:#2E6FD8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12212C; --surface:#1B2E3C; --ink:#EAF2F8; --soft:#A7B8C8; --line:#2E4558;
    --btn:#233A4B; --btn-h:#2C475B; --ok:#4CC47F; --bad:#FF8A5B; --gold:#FFD24A;
    --chip:#3A3420; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12212C; --surface:#1B2E3C; --ink:#EAF2F8; --soft:#A7B8C8; --line:#2E4558;
  --btn:#233A4B; --btn-h:#2C475B; --ok:#4CC47F; --bad:#FF8A5B; --gold:#FFD24A;
  --chip:#3A3420; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{touch-action:manipulation}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:20px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--minute);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:16px 20px 40px}

/* Kopfleiste */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar h1{font-size:1.5rem;margin:0;flex:1;min-width:200px}
.pts{font-weight:700;background:var(--chip);padding:6px 14px;border-radius:999px;white-space:nowrap}
.tog{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-size:.85rem}
.tog[aria-pressed="true"]{border-color:var(--minute)}

/* Übersicht */
.intro{color:var(--soft);margin:0 0 20px;max-width:60ch}
.legend{display:flex;gap:24px;flex-wrap:wrap;margin:0 0 22px;font-size:.95rem}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;border-radius:4px}
.path{display:flex;flex-direction:column;gap:12px;max-width:620px}
.stage{display:flex;align-items:center;gap:16px;text-align:left;width:100%;
  background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 18px}
.stage:hover:not(:disabled){border-color:var(--minute)}
.stage:disabled{opacity:.5;cursor:not-allowed}
.stage .no{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:1.3rem;background:var(--minute);color:#fff}
.stage:disabled .no{background:var(--soft)}
.stage .nm{flex:1;font-weight:700}
.stage .nm small{display:block;font-weight:400;color:var(--soft);font-size:.85rem}
.stars{font-size:1.4rem;letter-spacing:2px;white-space:nowrap}
.stars .on{color:var(--gold)} .stars .off{color:var(--line)}
.reset{margin-top:28px;background:none;border:none;color:var(--soft);text-decoration:underline;font-size:.85rem}

/* Spiel */
.game{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:28px;align-items:start}
@media (max-width:760px){.game{grid-template-columns:1fr}}
.clockbox{position:relative;background:var(--surface);border-radius:28px;padding:14px}
svg.clock{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.drag .grab{cursor:pointer}
.drag svg.clock{cursor:pointer}
svg.clock:focus{outline:none}
svg.clock:focus-visible{outline:3px solid var(--minute);outline-offset:4px;border-radius:50%}
.halo{opacity:0;transition:opacity .2s}
.sel .halo{opacity:.35}
.hand{transition:none}
.anim .hand{transition:transform .9s ease-in-out}
.panel{display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:none;background:none;color:var(--soft);text-decoration:underline;font-size:.9rem;padding:0}
.dots{display:flex;gap:6px}
.dots b{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots b.ok{background:var(--ok)} .dots b.no{background:var(--bad)} .dots b.now{outline:3px solid var(--minute);outline-offset:1px}
.tod{align-self:flex-start;display:flex;align-items:center;gap:10px;background:var(--chip);
  border-radius:999px;padding:6px 16px 6px 10px;font-weight:700}
.tod .ic{font-size:1.6rem;line-height:1}
.prompt{font-size:1.6rem;font-weight:700;margin:0}
.prompt .target{color:var(--minute)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice,.main{background:var(--btn);border:2px solid var(--line);border-radius:16px;padding:16px 12px;font-size:1.15rem;font-weight:700}
.choice:hover:not(:disabled),.main:hover:not(:disabled){background:var(--btn-h)}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--btn))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--btn))}
.choice:disabled{cursor:default}
.main{background:var(--minute);border-color:var(--minute);color:#fff;align-self:flex-start;padding:14px 28px}
.main:hover:not(:disabled){background:var(--minute);filter:brightness(1.08)}
.digi{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spin{display:flex;flex-direction:column;align-items:center;gap:6px}
.spin .val{font-size:2.6rem;font-weight:700;min-width:2.2ch;text-align:center;background:var(--surface);
  border:2px solid var(--line);border-radius:14px;padding:2px 12px;font-variant-numeric:tabular-nums}
.spin button{width:64px;border:2px solid var(--line);background:var(--btn);border-radius:12px;padding:4px 0;font-size:1rem;font-weight:700}
.spin button:hover{background:var(--btn-h)}
.spin .lbl{font-size:.8rem;color:var(--soft)}
.colon{font-size:2.6rem;font-weight:700;padding-bottom:6px}
.uhr{font-size:1.4rem;font-weight:700;align-self:center}
.fb{border-radius:16px;padding:14px 16px;font-size:1.02rem}
.fb.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border:2px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border:2px solid var(--bad)}
.fb strong{display:block;font-size:1.2rem;margin-bottom:4px}
.livesp{font-size:2rem;font-weight:700;margin:6px 0 4px;color:var(--minute)}
.livedig{display:flex;align-items:center;gap:12px;font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 16px}
.livedig .ic{font-size:1.5rem}
.livedig small{font-weight:400;color:var(--soft);font-size:1rem}

/* Sterne-Explosion */
.burst{position:absolute;inset:0;pointer-events:none;overflow:visible}
.burst span{position:absolute;left:50%;top:50%;font-size:34px;color:var(--gold);
  animation:fly .9s ease-out forwards;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.burst .plus{font-size:28px;font-weight:700;color:var(--ok);animation:rise 1s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(.3);opacity:1}
  to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1);opacity:0}}
@keyframes rise{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(-50%,-180%);opacity:0}}

/* Ergebnis */
.result{background:var(--surface);border-radius:28px;padding:32px;max-width:620px;text-align:center;margin:0 auto}
.result h2{margin:0 0 8px;font-size:1.8rem}
.bigstars{font-size:4rem;letter-spacing:8px;margin:10px 0}
.bigstars span{display:inline-block}
.bigstars .on{color:var(--gold);animation:pop .5s ease-out both}
.bigstars .off{color:var(--line)}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.sec{background:var(--btn);border:2px solid var(--line);border-radius:16px;padding:14px 22px;font-weight:700}
@media (prefers-reduced-motion: reduce){
  .burst span,.bigstars .on{animation:none}
  .burst{display:none}
  .anim .hand{transition:none}
}
/* Smartphone */
@media (max-width:600px){
  body{font-size:17px}
  .wrap{padding:10px 12px 28px}
  .bar{gap:8px;margin-bottom:10px}
  .bar h1{font-size:1.25rem;min-width:0;flex-basis:100%}
  .pts{font-size:.85rem;padding:4px 10px}
  .tog{font-size:.75rem;padding:4px 8px}
  .game{gap:12px}
  .clockbox{padding:6px;border-radius:20px;width:100%;max-width:min(100%,46vh);margin:0 auto}
  .panel{gap:10px}
  .meta{font-size:.9rem}
  .dots b{width:11px;height:11px}
  .tod{padding:4px 12px 4px 8px;font-size:.95rem}
  .tod .ic{font-size:1.3rem}
  .prompt{font-size:1.3rem}
  .choices{gap:8px}
  .choice{padding:12px 8px;font-size:1.02rem}
  .main{padding:12px 24px}
  .spin .val{font-size:2.1rem}
  .spin button{width:54px;padding:8px 0}
  .colon{font-size:2.1rem}
  .stage{padding:10px 12px;gap:12px}
  .stage .no{width:40px;height:40px}
  .livesp{font-size:1.5rem}
  .livedig{font-size:1.35rem}
  .result{padding:22px}
  .bigstars{font-size:3rem}
}
/* ---------- Erweiterungen ---------- */
:root{--rim:#1D3557;--hh:#E4572E;--mh:#2E6FD8}
.rank{font-size:.85rem;font-weight:700;color:var(--soft);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:620px;margin:0 0 22px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile:hover:not(:disabled){border-color:var(--minute)}
.tile .ti{font-size:1.6rem;line-height:1.2}
.tile b{font-size:1rem}
.tile small{color:var(--soft);font-size:.8rem}
.tile:disabled{opacity:.55;cursor:default}
.tick{display:flex;align-items:flex-end;gap:10px;margin:0 0 4px}
.tick .owl{flex:none;width:60px;height:60px}
.tick .owl svg{width:100%;height:100%;display:block}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:1rem;flex:1}
.bubble:before{content:"";position:absolute;left:-10px;bottom:14px;border-style:solid;border-width:8px 10px 8px 0;border-color:transparent var(--line) transparent transparent}
.fb .tick{margin:0}
.fb .bubble{border:none;background:none;padding:0}
.fb .bubble:before{display:none}
.joker{align-self:flex-start;background:var(--chip);border:2px solid var(--gold);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem}
.joker:disabled{opacity:.45;cursor:default}
.prow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.prompt.small{font-size:1.2rem;font-weight:400}
.prompt.small b,.prompt.small .target{font-weight:700}
.pill{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.9rem}
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:tin .3s ease-out;text-align:center}
@keyframes tin{from{transform:translateY(20px);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border-radius:24px;padding:20px;max-width:440px;width:100%;max-height:100%;overflow:auto}
.modal h2{margin:0 0 10px;font-size:1.4rem}
.demo{position:relative;width:min(100%,260px);margin:0 auto 12px}
.demo svg{width:100%;height:auto;display:block}
.demo .hand{transition:transform .8s ease-in-out}
.pointer{position:absolute;left:110%;top:110%;width:44px;height:44px;margin:-4px 0 0 -14px;transition:left .7s ease-in-out,top .7s ease-in-out,transform .2s;pointer-events:none;font-size:40px;line-height:1}
.pointer.mouse{margin:-2px 0 0 -2px}
.pointer.tap{transform:scale(.8)}
.pointer.fast{transition:transform .2s}
.steps{margin:0 0 14px;padding-left:1.4em}
.steps li{color:var(--soft);margin-bottom:6px}
.steps li.on{color:var(--ink);font-weight:700}
.expl{background:var(--surface);border-radius:24px;padding:20px;max-width:720px}
.expl h2{margin:0 0 6px;font-size:1.5rem}
.clocks{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
.mini{width:170px;text-align:center;font-weight:700;font-size:1rem}
.mini svg{width:100%;height:auto;display:block;margin-bottom:4px}
.arrow{font-size:1rem;color:var(--soft);text-align:center;max-width:120px}
.arrow b{display:block;font-size:1.8rem;color:var(--ink)}
.dauer{display:flex;gap:10px;justify-content:center}
.dauer .mini{width:48%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:340px;margin:10px 0 16px}
.cal span{text-align:center;padding:6px 0;border-radius:8px;font-size:.85rem;background:var(--btn)}
.cal span.h{background:none;color:var(--soft);font-weight:700}
.cal span.e{background:none}
.cal span.done{background:var(--ok);color:#fff;font-weight:700}
.cal span.today{outline:2px solid var(--minute)}
.box{background:var(--surface);border-radius:24px;padding:20px;max-width:720px}
.box h2{margin:0 0 10px;font-size:1.5rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.badge{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.badge .bi{font-size:2.2rem;line-height:1.2}
.badge.off{opacity:.45;filter:grayscale(1)}
.badge b{display:block;font-size:.95rem}
.badge small{color:var(--soft);font-size:.8rem}
.ws{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:20px;align-items:start}
.ws h3{margin:12px 0 8px;font-size:1.05rem}
.ws .prev svg{width:100%;height:auto;display:block}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{border:3px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 10px;font-size:.85rem;display:flex;align-items:center;gap:6px}
.sw button.cur{border-color:var(--minute)}
.sw button:disabled{opacity:.5;cursor:default}
.sw i{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.timer{height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.timer b{display:block;height:100%;background:var(--gold);width:100%}
.big{font-size:1.3rem;font-weight:700}
.tile.big{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;padding:16px 18px;border-color:var(--minute)}
.tile.big .ti{font-size:2.4rem}
.tile.big b{font-size:1.3rem}
.tile.big small{font-size:.9rem}
.sechand{animation:secspin 60s steps(60) infinite}
@keyframes secspin{to{transform:rotate(360deg)}}
.sw label.fc{position:relative;border:3px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 10px;font-size:.85rem;display:flex;align-items:center;gap:6px;cursor:pointer}
.sw label.fc.cur{border-color:var(--minute)}
.sw label.fc.dis{opacity:.5;cursor:default}
.sw label.fc input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.sw small{color:var(--soft);font-size:.75rem}
@media (min-width:601px){.ws .prev{position:sticky;top:10px}}
@media (prefers-reduced-motion: reduce){.sechand{animation:none}}
.cornerbtn{position:absolute;right:10px;bottom:10px;z-index:3;padding:10px 20px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.cornerbtn[hidden]{display:none}
.classic{display:flex;flex-direction:column;gap:10px;max-width:620px;margin-top:12px}
.stage .stars{font-size:1.05rem;letter-spacing:1px}
@media (max-width:600px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .ws{grid-template-columns:1fr}
  .ws .prev{max-width:220px;margin:0 auto}
  .mini{width:140px}
  .tick .owl{width:48px;height:48px}
  .bubble{font-size:.95rem}
  .prompt.small{font-size:1.05rem}
  .expl,.box{padding:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>Uhren-Spiel</h1>
    <span class="pts" id="pts">0 Punkte</span>
    <span class="rank" id="rank"></span>
    <button class="tog" id="tGuide">❓ Anleitung</button>
    <button class="tog" id="tHelp" aria-pressed="true">Minuten-Hilfe: an</button>
    <button class="tog" id="tSound" aria-pressed="true">🔊 Ton: an</button>
  </div>
  <main id="app"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="overlay" id="guide" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="gT">
    <h2 id="gT">So stellst du die Uhr</h2>
    <div class="demo" id="demo"></div>
    <ol class="steps" id="gSteps"></ol>
    <button class="main" id="gOk">Verstanden</button>
  </div>
</div>

<script>
(function(){
'use strict';
/* ================= Daten ================= */
var DUR=[5,10,15,20,25,30,45];
var STAGES=[
  {name:'Volle Stunden', sub:'Der große Zeiger steht auf der 12', mins:[0], snap:5,
   ex:'Steht der große Zeiger oben auf der 12, ist es eine volle Stunde. Der kleine Zeiger zeigt, welche Stunde es ist.', demo:[3,0]},
  {name:'Halbe Stunden', sub:'„halb vier“ und volle Stunden', mins:[30,30,30,0], snap:5,
   ex:'Steht der große Zeiger unten auf der 6, ist die Stunde halb vorbei. „Halb vier“ heißt: halb auf dem Weg zur 4. Der kleine Zeiger steht dann zwischen der 3 und der 4.', demo:[3,30]},
  {name:'Viertelstunden', sub:'viertel nach, viertel vor', mins:[15,45,15,45,30], snap:5,
   ex:'Die Uhr ist wie eine Pizza in vier Stücke geteilt. Steht der große Zeiger auf der 3, ist es viertel nach. Steht er auf der 9, ist es viertel vor: Bis zur nächsten Stunde fehlt noch ein Viertel.', demo:[3,15], demo2:[3,45]},
  {name:'Fünf-Minuten-Schritte', sub:'zehn nach, fünf vor halb … und Digitaluhr', mins:[5,10,20,25,35,40,50,55], snap:5,
   ex:'Von Zahl zu Zahl sind es 5 Minuten. Steht der große Zeiger auf der 2, ist es zehn nach. Auf der 8 ist es zwanzig vor. „Fünf vor halb“ heißt: noch 5 Minuten bis zur halben Stunde.', demo:[3,10], demo2:[3,25]},
  {name:'Jede Minute', sub:'Minuten genau ablesen, Digitaluhr', mins:null, snap:1,
   ex:'Jeder kleine Strich ist eine Minute. Zähl von der letzten Zahl aus weiter.', demo:[3,17]},
  {name:'Nur 12, 3, 6, 9', sub:'Zifferblatt mit nur vier Zahlen', mins:'mix', snap:1, reduced:true,
   ex:'Hier fehlen die meisten Zahlen. Sie stehen aber in Gedanken an derselben Stelle. Die Striche helfen beim Zählen.', demo:[4,20]},
  {name:'Digitaluhr einstellen', sub:'Digitalzeit auf der Uhr einstellen', mins:'mix', snap:1,
   ex:'Auf der Digitaluhr steht vor dem Doppelpunkt die Stunde, dahinter die Minuten. Nach 12 Uhr mittags zählt man weiter: 3 Uhr nachmittags ist 15 Uhr.', demo:[15,20]},
  {name:'Wie spät ist es gleich?', sub:'Die Uhr vorwärts stellen', type:'vor', snap:5,
   ex:'Dreh den großen Zeiger vorwärts. Kommt er über die 12, hat eine neue Stunde angefangen.', demo:[3,40], demo2:[4,5], arrow:'25 Minuten später'},
  {name:'Pünktlich losgehen', sub:'Vom Termin aus zurückrechnen', type:'rueck', snap:5,
   ex:'Fang beim Termin an und dreh den großen Zeiger rückwärts, so viele Minuten, wie du für den Weg brauchst.', demo:[8,0], demo2:[7,40], arrow:'20 Minuten früher'},

var tm=0, curSel=null, hoverA=null, mRot=0, hRot=0;

function enableDrag(snap){
  var svg=$('svg.clock'), sel=null, track=null;
  $('.clockbox').classList.add('drag');
  function angle(ev){
    var pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
    var p=pt.matrixTransform(svg.getScreenCTM().inverse());
    return (Math.atan2(p.x,-p.y)*180/Math.PI+360)%360;
  }
  function select(which){
    sel=which; curSel=which; renderDots();
    $('#hM').classList.toggle('sel',which==='m');
    $('#hH').classList.toggle('sel',which==='h');
    var t=$('#selhint');

  }
  function grabDown(which){return function(ev){

  };}
  $('#gM').addEventListener('pointerdown',grabDown('m'));

    $('.clockbox').classList.add('anim');

  }

    }

  svg.addEventListener('pointerup',function(ev){
    if(ev.pointerType!=='touch'||!track) return;
    var t=track; track=null;
    if(t.moved&&hoverA!==null&&!S.locked) apply(hoverA);
    hoverA=null; renderDots();
  });
  svg.addEventListener('pointercancel',function(){ track=null; hoverA=null; renderDots(); });

    if(S.locked) return;
    var d=0;
    if(ev.key==='ArrowRight') d=snap; else if(ev.key==='ArrowLeft') d=-snap;

  });
}

var S=null;
function randTime(si,avoid){
  var s=STAGES[si],h,m,guard=0;
  do{
    h=rand(24);
    if(s.mins==='mix'){ if(Math.random()<.5) m=rand(12)*5; else { do{m=rand(60);}while(m%5===0); } }
    else if(s.mins) m=pick(s.mins);
    else { m=rand(60); if(m%5===0 && Math.random()<.8) m=(m+1+rand(4))%60; }
    guard++;
  }while(avoid && avoid.h%12===h%12 && avoid.m===m && guard<20);
  return {h:h,m:m};
}
function genTask(si,kind,prev){
  var t={si:si,kind:kind,id:Math.random().toString(36).slice(2,10)};
  if(kind==='vor'||kind==='dauer'){
    var d=pick(DUR), cross=Math.random()<.6;
    var lo=cross?60-d:0, hi=cross?55:55-d;
    var sm=(lo/5+rand((hi-lo)/5+1))*5, sh=7+rand(12);
    t.start={h:sh,m:sm}; t.d=d; t.end=addMin(sh,sm,d);
    if(kind==='vor') t.tgt=t.end;
    return t;
  }
  if(kind==='rueck'||kind==='weg'){
    var sc=pick(kind==='weg'?SCEN.filter(function(x){return x.weg;}):SCEN), T=pick(sc.times);
    t.sc=sc.t.replace('{T}',digital(T[0],T[1])); t.way=sc.way||''; t.start={h:T[0],m:T[1]};
    if(kind==='weg'){
      var d1=pick([15,20,25,30,45]), d2=pick([5,10,15].filter(function(x){return x<d1;}));
      t.d1=d1; t.d2=d2; t.bus=Math.random()<.5; t.d=t.bus?d2:d1;
    } else t.d=pick(DUR);
    t.tgt=addMin(T[0],T[1],-t.d);
    return t;
  }
  var r=randTime(si,prev); t.h=r.h; t.m=r.m;
  if(kind.indexOf('wort')>0 && t.m%5) t.m=(Math.round(t.m/5)*5)%60;
  t.tgt={h:t.h,m:t.m};
  return t;
}
function makeRound(si,n){
  var base=PAT[si], ks=[];
  while(ks.length<n) ks=ks.concat(shuffle(base.slice()));
  ks=shuffle(ks.slice(0,n));
  var prev=null;
  return ks.map(function(k){var t=genTask(si,k,prev); prev=t.tgt; return t;});
}

function distractors(t,si){

/* ================= Runden starten ================= */
function startStage(si,withExpl){
  var expl=withExpl||!save.seen[si], tasks=[];
  if(expl) tasks=makeRound(si,PRACT).map(function(t){t.p=true;return t;});
  tasks=tasks.concat(makeRound(si,ROUND));
  S={mode:'stage',si:si,tasks:tasks,i:0,score:0,res:[],joker:true};
  if(expl){save.seen[si]=1;persist();explain(si);} else task();
}
function startDaily(){
  var maxS=Math.min(save.unlocked,STAGES.length), tasks=[], prev=null;
  for(var i=0;i<5;i++){var si=rand(maxS); var t=genTask(si,pick(PAT[si]),prev); prev=t.tgt; tasks.push(t);}
  S={mode:'daily',tasks:tasks,i:0,score:0,res:[],joker:true}; task();
}
function startBox(){
  if(!save.box.length) return;
  var tasks=shuffle(save.box.slice()).slice(0,ROUND).map(function(t){var c=JSON.parse(JSON.stringify(t)); c.p=false; return c;});
  S={mode:'box',tasks:tasks,i:0,score:0,res:[],joker:true}; task();
}
function addBox(t){
  if(save.box.some(function(x){return x.id===t.id;})) return;
  var c=JSON.parse(JSON.stringify(t)); delete c.p; save.box.push(c);
  while(save.box.length>20) save.box.shift();
}
function removeBox(t){ save.box=save.box.filter(function(x){return x.id!==t.id;}); }

/* ================= Eine Aufgabe ================= */
function modeLabel(){
  if(S.mode==='stage') return 'Stufe '+(S.si+1)+': '+STAGES[S.si].name;
  if(S.mode==='daily') return 'Tagesaufgabe';
  if(S.mode==='box') return 'Nochmal-Kiste';
  if(S.mode==='classic') return 'Training: '+STAGES[S.si].name;
  return '';
}
function task(){
  var t=S.tasks[S.i], st=STAGES[t.si];
  S.locked=false; curSel=null; hoverA=null;
  var mains=S.tasks.filter(function(x){return !x.p;}).length, first=S.tasks.length-mains, head;
  if(t.p) head='<span class="pill">Übung '+(S.i+1)+' von '+first+'</span>';
  else{ head='<div class="dots">'; for(var i=0;i<mains;i++) head+='<b class="'+(S.res[i]===true?'ok':S.res[i]===false?'no':i===S.i-first?'now':'')+'"></b>'; head+='</div>'; }
  var lesen=t.kind.indexOf('lesen')===0, td=tod(t.start?t.start.h:t.h), prompt, small=false;
  switch(t.kind){
    case 'lesen-wort': prompt='Wie spät ist es?'; break;

    case 'vor': small=true; prompt='Es ist <span class="target">'+digital(t.start)+'</span>. Wie spät ist es in <b>'+t.d+' Minuten</b>? Stell die Uhr.'; break;
    case 'rueck': small=true; prompt=t.sc+' Du brauchst <b>'+t.d+' Minuten</b>'+t.way+'. Wann musst du losgehen? Stell die Uhr.'; break;
    case 'weg': small=true; prompt=t.sc+' Zu Fuß brauchst du '+t.d1+' Minuten, mit dem Bus '+t.d2+' Minuten. <b>'+(t.bus?'Heute fährst du mit dem Bus.':'Heute gehst du zu Fuß.')+'</b> Wann musst du los? Stell die Uhr.'; break;
    case 'dauer': prompt='Wie lange dauert es vom Start bis zum Ende?'; break;
  }
  var clock=t.kind==='dauer'
    ? '<div class="dauer"><div class="mini">'+staticClock(t.start,null,st.reduced)+'Start</div><div class="mini">'+staticClock(t.end,null,st.reduced)+'Ende</div></div>'
    : mainClock(st.reduced);
  var joker=(t.p||S.mode==='classic')?'':'<button class="joker" id="joker"'+(S.joker?'':' disabled')+'>🦉 Joker'+(S.joker?'':' (verbraucht)')+'</button>';
  app.innerHTML='<div class="game"><div class="clockbox">'+clock+'<div class="burst" id="burst"></div><button class="main cornerbtn" id="cbtn" hidden></button></div>'+
    '<div class="panel"><div class="meta"><button class="back" id="back">Zur Übersicht</button>'+
    (S.mode==='stage'?'<button class="back" id="explBtn">Erklärung</button>':'')+
    '<span>'+modeLabel()+'</span></div>'+head+
    '<div class="tod"><span class="ic">'+td[0]+'</span>'+td[1]+'</div>'+
    '<p class="prompt'+(small?' small':'')+'">'+prompt+'</p>'+joker+
    '<div id="tip">'+(t.p?tickBox(firstTip(t)):'')+'</div><div id="ans"></div><div id="fb"></div></div></div>';
  $('#back').onclick=home;
  var eb=$('#explBtn'); if(eb) eb.onclick=function(){startStage(S.si,true);};
  syncBar();
  var ans=$('#ans');
  if(t.kind==='lesen-wort'||t.kind==='dauer'){
    if(t.kind==='lesen-wort') setTime(t.h,t.m,false);
    var right=t.kind==='dauer'?t.d+' Minuten':spoken(t.h,t.m);
    var opts=t.kind==='dauer'?durChoices(t):distractors(t,t.si);
    ans.innerHTML='<div class="choices">'+opts.map(function(o){return '<button class="choice">'+o+'</button>';}).join('')+'</div>';
    ans.querySelectorAll('.choice').forEach(function(b){b.onclick=function(){
      var ok=b.textContent===right;
      ans.querySelectorAll('.choice').forEach(function(x){x.disabled=true; if(ok||!t.p) if(x.textContent===right) x.classList.add('right');});
      if(!ok) b.classList.add('wrong');
      done(ok);
    };});
    S.jokerFn=function(){
      var wrong=[].filter.call(ans.querySelectorAll('.choice'),function(x){return x.textContent!==right;});
      shuffle(wrong).slice(0,2).forEach(function(x){x.style.visibility='hidden';x.disabled=true;});
      return 'Ich habe zwei falsche Antworten weggenommen.';
    };
  }else if(t.kind==='lesen-digital'){
    setTime(t.h,t.m,false);
    digiInput(ans,st.snap,function(h,m){return h===t.h&&m===t.m;});
  }else{
    if(t.start) setTime(t.start.h,t.start.m,false);
    else { var sh,sm; do{sh=rand(12);sm=Math.floor(rand(60)/st.snap)*st.snap;}while(sh===t.h%12); setTime(sh,sm,false); }
    enableDrag(st.snap||5);
    ans.innerHTML='<p id="selhint" style="margin:0;color:var(--soft);font-size:.95rem">'+HINT0+'</p>';
    corner('Fertig!',function(){
      S.locked=true; curSel=null; renderDots();
      $('#hM').classList.remove('sel'); $('#hH').classList.remove('sel');
      var ok=tm===((t.tgt.h%12)*60+t.tgt.m);
      if(!ok&&!t.p) setTimeout(function(){setTime(t.tgt.h,t.tgt.m,true);},500);
      done(ok);
    });
    S.jokerFn=function(){ setTime(Math.floor(tm/60),t.tgt.m,true); return 'Ich habe den großen Zeiger gestellt. Stell du jetzt den kleinen Zeiger.'; };
  }
  var jb=$('#joker');
  if(jb) jb.onclick=function(){
    if(!S.joker||S.locked) return;

    $('#tip').innerHTML=tickBox(S.jokerFn()); sndOk();
  };
  window.scrollTo(0,0);
}
function digiInput(ans,snap,check){
  var h=12,m=0;
  ans.innerHTML='<div class="digi">'+
    '<div class="spin"><button id="hU" aria-label="Stunde mehr">▲</button><div class="val" id="hV">12</div><button id="hD" aria-label="Stunde weniger">▼</button><span class="lbl">Stunden</span></div>'+
    '<span class="colon">:</span>'+
    '<div class="spin"><button id="mU" aria-label="Minuten mehr">▲'+(snap===1?' 1':' 5')+'</button><div class="val" id="mV">00</div><button id="mD" aria-label="Minuten weniger">▼'+(snap===1?' 1':' 5')+'</button><span class="lbl">Minuten</span></div>'+
    (snap===1?'<div class="spin"><button id="m5U" aria-label="5 Minuten mehr">▲ 5</button><div class="val" style="visibility:hidden">0</div><button id="m5D" aria-label="5 Minuten weniger">▼ 5</button><span class="lbl">&nbsp;</span></div>':'')+
    '<span class="uhr">Uhr</span></div>';
  function show(){$('#hV').textContent=h;$('#mV').textContent=String(m).padStart(2,'0');}
  $('#hU').onclick=function(){h=(h+1)%24;show();};
  $('#hD').onclick=function(){h=(h+23)%24;show();};
  $('#mU').onclick=function(){m=(m+snap)%60;show();};
  $('#mD').onclick=function(){m=(m-snap+60)%60;show();};
  if(snap===1){$('#m5U').onclick=function(){m=(m+5)%60;show();};$('#m5D').onclick=function(){m=(m+55)%60;show();};}
  corner('Prüfen',function(){
    ans.querySelectorAll('button').forEach(function(b){b.disabled=true;});
    done(check(h,m));
  });
  S.jokerFn=function(){ var t=S.tasks[S.i]; h=t.h; show(); return 'Die Stunde ist '+t.h+'. Stell du jetzt die Minuten ein.'; };
}
function burst(){
  var b=$('#burst'); if(!b) return; b.innerHTML='';
  for(var i=0;i<8;i++){
    var a=i/8*Math.PI*2, s=document.createElement('span');
    s.textContent='★'; s.style.setProperty('--dx',(Math.cos(a)*150)+'px'); s.style.setProperty('--dy',(Math.sin(a)*150)+'px');
    b.appendChild(s);
  }
  var p=document.createElement('span'); p.className='plus'; p.textContent='+10'; b.appendChild(p);
}
function corner(txt,fn){var b=$('#cbtn'); if(!b) return; b.hidden=false; b.disabled=false; b.textContent=txt; b.onclick=function(){b.disabled=true; fn();};}
function btn(cls,txt,fn){var b=document.createElement('button');b.className=cls;b.textContent=txt;b.onclick=fn;return b;}
function done(ok){
  var t=S.tasks[S.i], fb=$('#fb'), last=S.i===S.tasks.length-1;
  function next(){S.i++; if(S.i<S.tasks.length) task(); else finish();}
  S.locked=true;
  if(ok) cuckooCheck(t);
  if(t.p){
    if(ok){ sndOk(); burst(); fb.innerHTML='<div class="fb ok">'+tickBox('<strong>Richtig!</strong>'+pick(CHEERS))+'</div>'; }
    else{ sndNo(); fb.innerHTML='<div class="fb no">'+tickBox('<strong>Noch nicht ganz.</strong>'+hint(t,false))+'</div>'; }
    if(ok) corner(S.tasks[S.i+1]&&!S.tasks[S.i+1].p?'Jetzt zählt es!':'Weiter',next);
    else{ corner('Nochmal',function(){task();}); var sk=btn('back','Aufgabe überspringen',next); sk.style.marginTop='10px'; fb.appendChild(sk); }
  }else{
    var k=S.i-(S.tasks.length-S.tasks.filter(function(x){return !x.p;}).length);
    S.res[k]=ok;
    if(ok){
      S.score++; save.streak++; addPoints(10); sndOk(); burst(); award('first');
      if(save.streak>=10) award('streak10');
      if(S.mode==='box') removeBox(t);
      fb.innerHTML='<div class="fb ok">'+tickBox('<strong>'+pick(CHEERS)+'</strong>Richtig: '+answerText(t)+'.')+'</div>';
    }else{
      save.streak=0; addBox(t); sndNo();
      fb.innerHTML='<div class="fb no">'+tickBox('<strong>Noch nicht ganz.</strong>Richtig ist: '+answerText(t)+'. '+hint(t,true))+'</div>';
    }
    persist();
    var dts=app.querySelectorAll('.dots b'); if(dts[k]) dts[k].className=ok?'ok':'no';
    corner(last?'Ergebnis':'Weiter',next);
  }
  var nb=$('#cbtn');
  try{nb.focus({preventScroll:true});}catch(e){}
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}

}
function classicResult(){

function bigStars(n){var s='';for(var k=0;k<5;k++) s+='<span class="'+(k<n?'on':'off')+'" style="animation-delay:'+(k*.2)+'s">★</span>';return s;}
function stageResult(){
  var sc=S.score, si=S.si, stars=STARS[sc], unlockedNew=false;
  if(stars>save.stars[si]) save.stars[si]=stars;
  if(stars>=PASS && si<STAGES.length-1 && save.unlocked<si+2){save.unlocked=si+2;unlockedNew=true;}
  if(stars===5) award('stars5');
  if(stars>=4&&si===2) award('viertel');
  if(stars>=4&&si===6) award('digital');
  if(stars>=4&&si===10) award('rechnen');
  if(save.unlocked>=STAGES.length) award('all');
  persist(); syncBar();
  var msg;
  if(sc===ROUND) msg='Alles richtig – du bist ein Uhren-Profi!';
  else if(stars>=PASS) msg='Super gemacht!';
  else if(save.unlocked>si+1) msg='Gut geübt! Mit 6 richtigen bekommst du 4 Sterne.';
  else msg='Für die nächste Stufe brauchst du 4 Sterne, also 6 richtige. Versuch es gleich nochmal!';
  if(unlockedNew) msg+=' Stufe '+(si+2)+' ist jetzt frei.';
  if(unlockedNew&&si===0){ msg+=' Und neu auf der Übersicht: das Training! Probier es mal aus.'; setTimeout(function(){toast('🎯 Neu: Training ist offen!');sndBadge();},700); }
  app.innerHTML='<div class="result"><h2>'+sc+' von '+ROUND+' richtig</h2><div class="bigstars">'+bigStars(stars)+'</div>'+tickBox(msg)+
    '<div class="btnrow"><button class="sec" id="again">Nochmal spielen</button>'+
    (save.unlocked>si+1&&si<STAGES.length-1?'<button class="main" id="next">Weiter zu Stufe '+(si+2)+'</button>':'')+
    '<button class="sec" id="expl">Erklärung ansehen</button><button class="sec" id="home">Zur Übersicht</button></div></div>';
  if(stars>0) sndWin();

  $('#expl').onclick=function(){startStage(si,true);};
  $('#home').onclick=home;
  var n=$('#next'); if(n) n.onclick=function(){startStage(si+1,false);};

}
function calendar(){

}

  persist(); S={mode:'blitzEnd'}; sndWin();
  app.innerHTML='<div class="box"><h2>⚡ Zeit ist um!</h2>'+tickBox(sc+' richtige in 60 Sekunden. '+(rec?'Neuer Rekord!':'Dein Rekord: '+save.blitz+'.'))+
    '<div class="prow"><button class="main" id="again">Nochmal</button><button class="sec" id="home">Zur Übersicht</button></div></div>';
  $('#again').onclick=blitzStart; $('#home').onclick=home; window.scrollTo(0,0);
}

/* ================= Freies Üben ================= */
function free(){
  stopTimers();
  S={mode:'free',locked:false}; curSel=null; hoverA=null;
  award('free');
  app.innerHTML='<div class="game"><div class="clockbox">'+mainClock(false)+'</div>'+
    '<div class="panel"><div class="meta"><button class="back" id="back">Zur Übersicht</button><span>Freies Üben</span></div>'+
    '<p id="selhint" style="margin:0;color:var(--soft);font-size:.95rem">'+HINT0+'</p><div id="live"></div></div></div>';
  $('#back').onclick=home; syncBar();
  setTime(3,0,false); enableDrag(1); freeInfo();
  window.scrollTo(0,0);
}
function freeInfo(){
  var el=document.getElementById('live'); if(!el) return;
  var h=Math.floor(tm/60), m=tm%60, sp=spoken(h,m);
  function row(hh){var t=tod(hh);return '<div class="livedig"><span class="ic">'+t[0]+'</span>'+digital(hh,m)+' <small>'+t[1]+'</small></div>';}
  el.innerHTML=(sp?'<p class="livesp">'+sp+'</p>':'')+row(h)+row(h+12);
}

/* ================= Werkstatt und Abzeichen ================= */
function werkstatt(msg){
  stopTimers(); S=null;
  var L=save.look, P=save.points;
  function lock(p){return ' <small>🔒 ab '+p+'</small>';}
  function opt(key,i,x,inner){var locked=P<x.p, cur=L[key]===i;
    return '<button data-k="'+key+'" data-i="'+i+'" class="'+(cur?'cur':'')+'"'+(locked?' disabled':'')+'>'+inner+(locked?lock(x.p):'')+'</button>';}
  function colorGroup(title,key){
    return '<h3>'+title+'</h3><div class="sw">'+LISTS[key].map(function(x,i){
      if(x.free){var locked=P<x.p, cur=L[key]===i;
        return '<label class="fc'+(cur?' cur':'')+(locked?' dis':'')+'"><i style="background:'+(cur?L.cust[key]:'conic-gradient(#e53935,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)')+'"></i>🎨 Freie Farbe'+(locked?lock(x.p):'')+
          '<input type="color" data-k="'+key+'" data-i="'+i+'" value="'+L.cust[key]+'"'+(locked?' disabled':'')+'></label>';}
      return opt(key,i,x,'<i style="background:'+x.c+'"></i>'+x.n);
    }).join('')+'</div>';
  }
  function plain(title,list,key,styleFn){
    return '<h3>'+title+'</h3><div class="sw">'+list.map(function(x,i){return opt(key,i,x,'<span'+(styleFn?' style="'+styleFn(x)+'"':'')+'>'+x.n+'</span>');}).join('')+'</div>';}
  function toggles(title,list,obj){
    return '<h3>'+title+'</h3><div class="sw">'+list.map(function(x){var locked=P<x.p,on=!!L[obj][x.k];
      return '<button data-t="'+obj+'" data-key="'+x.k+'" class="'+(on?'cur':'')+'"'+(locked?' disabled':'')+'>'+x.e+' '+x.n+(locked?lock(x.p):(on?' ✓':''))+'</button>';}).join('')+'</div>';}
  FONTS.forEach(function(f){if(P>=f.p) loadFont(f);});
  app.innerHTML='<div class="box"><h2>🎨 Uhren-Werkstatt</h2><div id="wsTick">'+tickBox(msg||('Gestalte deine eigene Uhr! Du hast '+P+' Punkte. Bei gesperrten Teilen steht, ab wie vielen Punkten sie frei werden.'))+'</div>'+
    '<div class="ws" style="margin-top:14px"><div class="prev">'+staticClock(3,40,false,true)+'</div><div>'+
    colorGroup('Zifferblatt','face')+colorGroup('Rand','rim')+colorGroup('Stundenzeiger (klein)','hour')+colorGroup('Minutenzeiger (groß)','min')+
    plain('Zeigerform',HANDS,'hand')+plain('Schrift der Zahlen',FONTS,'font',function(f){return "font-family:'"+f.f+"',Andika,sans-serif";})+
    plain('Uhrform',FORMS,'shape')+plain('Mittelstück',CENTERS,'center')+plain('Muster',PATTERNS,'pattern')+
    toggles('Sticker',STICKERS,'st')+plain('Klang',SOUNDS,'sound')+toggles('Extras',EXTRAS,'ex')+
    '</div></div><div class="prow" style="margin-top:18px"><button class="main" id="home">Fertig</button></div></div>';
  function clash(key,col){
    if(key!=='hour'&&key!=='min') return false;
    var other=key==='hour'?colorOf('min'):colorOf('hour');
    return cdist(col,other)<80;
  }
  var CL='Die beiden Zeiger brauchen verschiedene Farben, sonst verwechselst du sie. Nimm eine andere Farbe!';
  function changed(){persist();applyLook();award('werk');}
  app.querySelectorAll('.sw button[data-k]').forEach(function(b){b.onclick=function(){
    var k=b.dataset.k, i=+b.dataset.i;
    if(LISTS[k]){var it=LISTS[k][i]; if(!it.free&&clash(k,it.c)){werkstatt(CL);sndNo();return;}}
    L[k]=i; changed(); if(k==='sound') sndOk(); werkstatt();
  };});
  app.querySelectorAll('.sw button[data-t]').forEach(function(b){b.onclick=function(){
    var o=b.dataset.t, k=b.dataset.key; L[o][k]=!L[o][k]; changed(); if(o==='ex'&&k==='kuckuck'&&L.ex.kuckuck) cuckoo(); werkstatt();
  };});
  app.querySelectorAll('.sw input[type=color]').forEach(function(inp){inp.onchange=function(){
    var k=inp.dataset.k, v=inp.value;
    if(clash(k,v)){werkstatt(CL);sndNo();return;}
    L.cust[k]=v; L[k]=+inp.dataset.i; changed(); werkstatt();
  };});
  $('#home').onclick=home;
}
function badgesScreen(){
  stopTimers(); S=null;
  app.innerHTML='<div class="box"><h2>🏅 Abzeichen</h2>'+tickBox('Du hast '+Object.keys(save.badges).length+' von '+BADGES.length+' Abzeichen gesammelt.')+
    '<div class="badges">'+BADGES.map(function(b){return '<div class="badge'+(save.badges[b[0]]?'':' off')+'"><div class="bi">'+b[1]+'</div><b>'+b[2]+'</b><small>'+b[3]+'</small></div>';}).join('')+
    '</div><div class="prow" style="margin-top:18px"><button class="main" id="home">Zur Übersicht</button></div></div>';
  $('#home').onclick=home; window.scrollTo(0,0);
}

/* ================= Anleitung ================= */
var gTok=0;
function openGuide(){
  var ov=$('#guide'); ov.hidden=false;
  var steps=[
    'Zuerst den großen Zeiger: '+(TOUCH?'antippen, mit dem Finger am Rand entlang ziehen und loslassen.':'anklicken, mit der Maus am Rand entlangfahren und klicken.')+' Der Punkt zeigt, wohin er geht.',
    'Dann den kleinen Zeiger genauso. Er steht oft zwischen zwei Zahlen – je nachdem, wo der große Zeiger steht. Darum kommt er als Zweites.',
    'Zum Schluss unten rechts auf „Fertig!“ '+(TOUCH?'tippen.':'klicken.')];
  $('#gSteps').innerHTML=steps.map(function(s){return '<li>'+s+'</li>';}).join('');
  $('#demo').innerHTML='<svg viewBox="-172 -172 344 344">'+faceSVG(false,false)+
    '<g class="hand" id="dHH" style="transform:rotate(90deg)"><line class="halo" x1="0" y1="16" x2="0" y2="-68" stroke="var(--hh)" stroke-width="36" stroke-linecap="round"/>'+hourHand()+'</g>'+
    '<g class="hand" id="dHM"><line class="halo" x1="0" y1="20" x2="0" y2="-120" stroke="var(--mh)" stroke-width="26" stroke-linecap="round"/>'+minHand()+'</g>'+
    centerSVG()+'<circle id="dDot" r="11" fill="var(--mh)" stroke="#fff" stroke-width="3" style="display:none"/></svg>'+
    '<span class="main cornerbtn" style="right:0;bottom:0;padding:6px 12px;font-size:.9rem">Fertig!</span>'+
    (TOUCH?'<div class="pointer" id="dPtr">👆</div>':'<div class="pointer mouse" id="dPtr"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M3 2 L3 20 L8 15 L11.5 22 L14.5 20.5 L11 14 L18 14 Z" fill="#fff" stroke="#1D3557" stroke-width="1.6" stroke-linejoin="round"/></svg></div>');
  var tok=++gTok;
  function pos(deg,r){var a=deg*Math.PI/180;return {x:(50+Math.sin(a)*r/344*100)+'%',y:(50-Math.cos(a)*r/344*100)+'%'};}
  function at(ms,fn){setTimeout(function(){if(tok===gTok&&!ov.hidden) fn();},ms);}
  function mark(i){[].forEach.call($('#gSteps').children,function(li,j){li.classList.toggle('on',j===i);});}
  function loop(){
    var P=$('#dPtr'), M=$('#dHM'), H=$('#dHH'), D=$('#dDot'); if(!P) return;
    M.style.transform='rotate(0deg)'; H.style.transform='rotate(90deg)'; M.classList.remove('sel'); H.classList.remove('sel');
    D.style.display='none'; P.classList.remove('fast'); mark(-1);
    P.style.left='105%'; P.style.top='105%';
    function move(deg,r){var p=pos(deg,r);P.style.left=p.x;P.style.top=p.y;}
    function tap(){P.classList.add('tap');setTimeout(function(){P.classList.remove('tap');},220);}
    function sweep(from,to,dur,col){
      D.setAttribute('fill',col); D.style.display=''; P.classList.add('fast'); if(TOUCH) P.classList.add('tap'); var t0=null;
      function step(ts){ if(tok!==gTok||ov.hidden) return; if(!t0)t0=ts; var k=Math.min(1,(ts-t0)/dur), deg=from+(to-from)*k, a=deg*Math.PI/180;
        D.setAttribute('cx',(Math.sin(a)*146).toFixed(1)); D.setAttribute('cy',(-Math.cos(a)*146).toFixed(1));
        move(deg,146); if(k<1) requestAnimationFrame(step); }
      requestAnimationFrame(step);
    }
    function release(G,deg){ P.classList.remove('tap'); if(!TOUCH) tap(); D.style.display='none'; G.style.transform='rotate('+deg+'deg)'; G.classList.remove('sel'); P.classList.remove('fast'); }
    /* 1. großer Zeiger: von 12 auf 6 */
    at(400,function(){mark(0);move(0,70);});
    at(1300,function(){tap();M.classList.add('sel');});
    at(2000,function(){move(0,146);});
    at(2700,function(){sweep(0,180,1500,'var(--mh)');});
    at(4400,function(){release(M,180);});
    /* 2. kleiner Zeiger: zwischen 3 und 4 */
    at(5200,function(){mark(1);move(90,45);});
    at(6100,function(){tap();H.classList.add('sel');});
    at(6800,function(){move(90,146);});
    at(7500,function(){sweep(90,105,700,'var(--hh)');});
    at(8400,function(){release(H,105);});
    /* 3. Fertig */
    at(9200,function(){mark(2);P.style.left='88%';P.style.top='93%';});
    at(10100,tap);
    at(10600,function(){P.style.left='110%';P.style.top='110%';});
    at(12000,loop);
  }
  loop();
  $('#gOk').focus();
}
function closeGuide(){$('#guide').hidden=true;gTok++;save.guided=1;persist();}
$('#gOk').onclick=closeGuide;
$('#guide').addEventListener('click',function(e){if(e.target.id==='guide') closeGuide();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#guide').hidden) closeGuide();});

/* ================= Start ================= */
applyLook(); syncBar(); home();
if(!save.guided) openGuide();
window.__uhr={S:function(){return S;},tm:function(){return tm;},spoken:spoken,set:function(h,m){setTime(h,m,false);}};
})();
</script>
