<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title></title>
<link rel="stylesheet" href="../style.css">
<style>.app .sub{margin-top:-6px;font-size:12px;line-height:1.2;color:var(--mut);text-align:center;max-width:110px}</style>
<script>try{if(sessionStorage.getItem("schule-pw")!=="1")document.documentElement.classList.add("gesperrt")}catch(e){document.documentElement.classList.add("gesperrt")}</script>
<style>
html.gesperrt body>*:not(#pw){display:none!important}
html:not(.gesperrt) #pw{display:none}
#pw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#pw-f{width:min(300px,100%);display:flex;flex-direction:column;gap:12px;align-items:center;padding:24px;border:1px solid var(--edge);border-radius:20px;background:var(--field);backdrop-filter:blur(8px)}
#pw-f.nein{animation:wackel .4s}
@keyframes wackel{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#pw-i{width:100%;padding:12px 14px;border:1px solid var(--edge);border-radius:12px;background:var(--field);color:var(--ink);font:inherit;font-size:20px;text-align:center;letter-spacing:.1em}
#pw-i:focus{outline:2px solid hsl(var(--h) 70% 52%);outline-offset:1px}
#pw-f button{width:100%;padding:12px;border:0;border-radius:12px;background:hsl(var(--h) 70% 52%);color:#fff;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="pw"><form id="pw-f" autocomplete="off"><div style="font-size:36px">🔒</div><input id="pw-i" type="password" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Passwort"><button>öffnen</button></form></div>
<script>
(function(){
const H=s=>{let h=7;for(let i=0;i<s.length;i++)h=(Math.imul(h,31)+s.charCodeAt(i))>>>0;return h};
const f=document.getElementById("pw-f"),i=document.getElementById("pw-i");
if(document.documentElement.classList.contains("gesperrt"))setTimeout(()=>i.focus(),60);
f.addEventListener("submit",e=>{
  e.preventDefault();
  if(H(i.value.trim().toUpperCase())===267398970){
    try{sessionStorage.setItem("schule-pw","1")}catch(x){}
    document.documentElement.classList.remove("gesperrt");
  }else{
    i.value="";f.classList.remove("nein");void f.offsetWidth;f.classList.add("nein");
  }
});
})();
</script>
<main>
<h1 id="h"></h1>
<input id="q" type="search" placeholder="Suchen …" autocomplete="off">
<div id="grid" class="grid"><a class="app" href="../plus-hack/" title="Geschickt addieren (Kl. 5)">
<span class="ico" style="--h:246">P</span>
<span class="lbl">Plus-Hack</span>
<span class="sub">Geschickt addieren (Kl. 5)</span></a><a class="app" href="pythagoras-quadrate.html" title="Pythagoras, Kl. 9">
<span class="ico" style="--h:206">Q</span>
<span class="lbl">Quadrate am Dreieck</span>
<span class="sub">Pythagoras, Kl. 9</span></a></div>
<p id="msg"></p>
</main>
<script src="../app.js"></script>
</body>
</html>
