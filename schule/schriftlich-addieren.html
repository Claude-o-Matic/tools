<style>
:root{
  --papier:#fdfcf6; --karo:#d9e6f2; --karo-stark:#b9d0e6;
  --tinte:#1b4a85; --tinte-hell:#5e8cbb;
  --rot:#d23b2f; --gruen:#2f8f5b; --gelb:#ffe49c; --gelb-tief:#4a3a00;
  --grau:#6c7580; --rand:#dcd8cc;
  --sw0:#e8862a; --sw1:#2f8f5b; --sw2:#7b3fa0; --sw3:#2f6f9f; --sw4:#d9257e; --sw5:#8a6a20;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papier:#191c21; --karo:#283039; --karo-stark:#3d4954;
    --tinte:#8ec0f5; --tinte-hell:#5e8cbb;
    --rot:#ff7a6e; --gruen:#6ddc9c; --gelb:#5d4f20; --gelb-tief:#ffe9b0;
    --grau:#9aa3ae; --rand:#333a42;
    --sw0:#f0a45c; --sw1:#6ddc9c; --sw2:#c08ae0; --sw3:#7fb6e8; --sw4:#f287b8; --sw5:#d9b26a;
    color-scheme: dark;

}

html,body{height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

.punkt{width:13px;height:13px;border-radius:50%;border:2px solid var(--karo-stark);transition:.25s}

.chip.rund{width:34px;padding:0;font-size:18px}

.karte{background:var(--papier);border:2px solid var(--rand);border-radius:16px;padding:14px 12px;box-shadow:0 2px 0 var(--rand)}

@keyframes rein{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
td.op{width:28px;font-size:25px;color:var(--grau);border:none;background:none}
td.leer{border-color:transparent;background:none}

.marke{text-align:center;font-size:14px;font-weight:800;color:var(--grau);margin-top:8px}
@keyframes puls{0%,100%{box-shadow:0 0 0 0 rgba(27,74,133,.22)}50%{box-shadow:0 0 0 7px rgba(27,74,133,0)}}
@keyframes wackel{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.block{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.taste{border:2px solid var(--rand);background:var(--papier);color:var(--tinte);border-radius:12px;height:54px;

.taste:active{transform:translateY(2px);box-shadow:none}
.taste:focus-visible{outline:3px solid var(--tinte);outline-offset:2px}
.taste.weg{color:var(--rot);font-size:20px}
.taste.ok{grid-column:span 2;background:var(--tinte);color:var(--papier);border-color:var(--tinte)}
.hilfe{width:100%;border:2px solid var(--gelb);background:var(--gelb);color:var(--gelb-tief);border-radius:12px;height:48px;
  font-family:inherit;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.hilfe:disabled{opacity:.35;cursor:default}
.stufen-punkte{display:flex;gap:4px;justify-content:center}
.sp{width:9px;height:9px;border-radius:50%;background:var(--karo-stark)}
.sp.an{background:var(--rot)}
.ende{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.gross{font-size:44px}
.over{position:fixed;inset:0;background:rgba(10,20,35,.35);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,16,28,.74);

.over-karte{background:var(--papier);border:2px solid var(--rand);border-radius:18px;padding:16px;max-width:400px;width:100%;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
const H=s=>{let h=7;for(let i=0;i<s.length;i++)h=(Math.imul(h,31)+s.charCodeAt(i))>>>0;return h};
const f=document.getElementById("pw-f"),i=document.getElementById("pw-i");
if(document.documentElement.classList.contains("gesperrt"))setTimeout(()=>i.focus(),60);
f.addEventListener("submit",e=>{
  e.preventDefault();
  if(H(i.value.trim().toUpperCase())===8596675){
    try{sessionStorage.setItem("sa-pw","1")}catch(x){}
    document.documentElement.classList.remove("gesperrt");
  }else{
    i.value="";f.classList.remove("nein");void f.offsetWidth;f.classList.add("nein");
  }
});
})();
</script>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const NAMEN=["E","Z","H","T","ZT","HT"];
const PRO_RUNDE=6;
const TEMPO=1.3, t=ms=>Math.round(ms*TEMPO);
const SCHNELL_MS=9000, SCHNELL_NOETIG=3;

const STUFEN=[
  {titel:"Einsteiger",   stellen:[3,2]},
  {titel:"Standard",     stellen:[3,3]},
  {titel:"Große Zahlen", stellen:[4,3]},
  {titel:"Profi",        stellen:[4,4]},
  {titel:"Dreierpack",   stellen:[3,3,3]},
  {titel:"Endgegner",    stellen:[4,4,4]}
];
const ARTEN=["rechnen","rechnen","luecke","rechnen","fehler","rechnen"];

let stufe=0, nr=0, verlauf=[], aufgabe=null;
let eingabe="", hilfeStufe=0, hilfeBenutzt=false, laeuft=false;
let startZeit=0, schnellSerie=0;

const zufall=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const ziffer=(z,k)=>Math.floor(z/Math.pow(10,k))%10;

function spaltenRechnung(zahlen){
  const summe=zahlen.reduce((a,b)=>a+b,0);
  const n=Math.max(Math.max(...zahlen.map(z=>String(z).length)),String(summe).length);
  const out=[]; let c=0;
  for(let k=0;k<n;k++){
    const teile=[]; if(c) teile.push(c);
    zahlen.forEach(z=>{ if(String(z).length>k) teile.push(ziffer(z,k)); });
    const s=c+zahlen.reduce((a,z)=>a+ziffer(z,k),0);
    out.push({k,teile,summe:s,ziffer:s%10,carry:Math.floor(s/10),carryIn:c});
    c=Math.floor(s/10);
  }
  return {n,out,summe};
}

function roheAufgabe(){
  const st=STUFEN[stufe].stellen;
  for(let v=0;v<400;v++){
    const zahlen=st.map(s=>zufall(Math.pow(10,s-1),Math.pow(10,s)-1));
    const r=spaltenRechnung(zahlen);
    if(r.out.some(o=>o.carry>0)) return {zahlen,...r};
  }
  const zahlen=[358,276]; return {zahlen,...spaltenRechnung(zahlen)};
}

function baueAufgabe(art){
  const a=roheAufgabe();
  a.art=art||"rechnen";
  if(a.art==="luecke"){
    const i=zufall(0,a.zahlen.length-1);
    const len=String(a.zahlen[i]).length;
    a.lueckeZeile=i;
    a.lueckeSp=zufall(0,len-1);
    a.lueckeZiffer=ziffer(a.zahlen[i],a.lueckeSp);
  }
  if(a.art==="fehler"){
    const kandidaten=[];
    a.out.forEach(o=>{ if(o.carry>0 && o.k+1<a.n) kandidaten.push({typ:"uebertrag",k:o.k+1}); });
    a.out.forEach(o=>{ if(o.k<String(a.summe).length) kandidaten.push({typ:"rechnen",k:o.k}); });
    const f=kandidaten[zufall(0,kandidaten.length-1)];
    a.fehlerSp=f.k; a.fehlerTyp=f.typ;
    a.falschZiffer = f.typ==="uebertrag"
      ? (a.out[f.k].ziffer+9)%10
      : (a.out[f.k].ziffer+(Math.random()<0.5?1:9))%10;
  }
  return a;
}

/* ---------- Startbildschirm ---------- */
function miniBild(stellen){
  let h='<div class="mini-bild">';
  stellen.forEach(s=>{ h+='<div class="mini-zeile">'+'<div class="mini-kasten"></div>'.repeat(s)+'</div>'; });
  h+='<div class="mini-zeile summe">'+'<div class="mini-kasten"></div>'.repeat(Math.max(...stellen)+1)+'</div>';
  return h+'</div>';
}
function zeichneStart(){
  $("stufen-wahl").innerHTML=STUFEN.map((s,i)=>
    `<button class="stufe-karte" data-i="${i}">${miniBild(s.stellen)}<div class="titel">${s.titel}</div><div class="form">${s.stellen.join(" + ")}</div></button>`).join("");
  $("stufen-wahl").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    stufe=+b.dataset.i; nr=0; verlauf=[]; schnellSerie=0;
    $("start").classList.add("verstecken");
    $("zwischen").classList.remove("verstecken");
    $("z-titel").textContent=STUFEN[stufe].titel;
    $("z-bild").innerHTML=miniBild(STUFEN[stufe].stellen);
  }));
}

/* ---------- Gitter ---------- */
function zeichneGitter(){
  const sp=[]; for(let k=aufgabe.n-1;k>=0;k--) sp.push(k);
  let h='<table class="rg"><tr><td class="op"></td>';
  sp.forEach(k=>h+=`<td class="kopfz sw${k}" id="k${k}">${NAMEN[k]||""}</td>`);
  h+='</tr>';
  aufgabe.zahlen.forEach((z,i)=>{
    h+='<tr><td class="op">'+(i===0?"":"+")+'</td>';
    sp.forEach(k=>{
      const leer=String(z).length<=k;
      let inhalt=leer?"":ziffer(z,k), klasse="";
      if(aufgabe.art==="luecke" && i===aufgabe.lueckeZeile && k===aufgabe.lueckeSp){ inhalt="?"; klasse="luecke"; }
      h+=`<td class="zahl sw${k} ${leer?'leer':''} ${klasse}" data-sp="${k}" data-r="s" id="s${i}_${k}">${inhalt}</td>`;
    });
    h+='</tr>';
  });
  h+='<tr><td class="op"></td>';
  sp.forEach(k=>h+=`<td class="ue" data-sp="${k}" id="c${k}"></td>`);
  h+='</tr><tr class="erg '+((aufgabe.art!=="rechnen")?"gezeigt":"")+'"><td class="op"></td>';
  sp.forEach(k=>h+=`<td class="zahl sw${k}" data-sp="${k}" data-r="e" id="r${k}"></td>`);
  h+='</tr></table>';
  $("gitter").innerHTML=h;

  aufgabe.out.forEach(o=>{ if(o.carry>0&&o.k+1<aufgabe.n){const e=$("c"+(o.k+1)); if(e) e.classList.add("box");} });

  if(aufgabe.art!=="rechnen"){
    const erg=String(aufgabe.summe);
    aufgabe.out.forEach(o=>{ if(o.k<erg.length){ const r=$("r"+o.k); if(r) r.textContent=o.ziffer; } });
  }
  if(aufgabe.art==="fehler"){
    const r=$("r"+aufgabe.fehlerSp); if(r) r.textContent=aufgabe.falschZiffer;
    aufgabe.out.forEach(o=>{ if(o.carry>0&&o.k+1<aufgabe.n){
      const c=$("c"+(o.k+1));
      if(c && !(aufgabe.fehlerTyp==="uebertrag" && o.k+1===aufgabe.fehlerSp)) c.textContent=o.carry;
    }});
    document.querySelectorAll('#gitter tr.erg td.zahl').forEach(td=>{
      td.classList.add("tipp");
      td.addEventListener("click",()=>tippeZelle(td));
    });
  }
}
function hellSpalte(k,an){
  document.querySelectorAll(`#gitter td[data-sp="${k}"]`).forEach(td=>td.classList.toggle("hell",an));
}
function blase(txt,el){ const b=el||$("blase"); b.textContent=txt||""; b.classList.toggle("da",!!txt); }

let tourSofort=false;
function flug(von,zu,text,fertig){
  if(!von||!zu||tourSofort){ if(zu) zu.textContent=text; if(fertig) fertig(); return; }
  const a=von.getBoundingClientRect(), b=zu.getBoundingClientRect();
  const e=document.createElement("div");
  e.className="flug"; e.textContent=text;
  e.style.left=(a.left+a.width/2-8)+"px"; e.style.top=(a.top+a.height/2-12)+"px";
  document.body.appendChild(e);
  requestAnimationFrame(()=>{ e.style.transform=`translate(${b.left-a.left}px, ${b.top-a.top-4}px) scale(1.1)`; });
  setTimeout(()=>{ e.remove(); zu.textContent=text; if(fertig) fertig(); },1000);
}

/* ---------- Hilfe ---------- */
function hilfeSchritt(auto){
  if(laeuft||!aufgabe) return;
  if(aufgabe.art==="luecke") return hilfeLuecke();
  if(aufgabe.art==="fehler") return hilfeFehler();
  const k=hilfeStufe;
  if(k>=aufgabe.n) return;
  hilfeBenutzt=true; laeuft=true;
  for(let i=0;i<aufgabe.n;i++) hellSpalte(i,false);
  hellSpalte(k,true);
  const kf=$("k"+k); if(kf){kf.classList.add("an"); setTimeout(()=>kf.classList.remove("an"),t(1100));}
  const o=aufgabe.out[k];
  const zellen=[];
  if(o.carryIn){const c=$("c"+k); if(c&&c.textContent) zellen.push(c);}
  document.querySelectorAll(`#gitter td[data-sp="${k}"][data-r="s"]`).forEach(td=>{ if(td.textContent) zellen.push(td); });
  zellen.forEach((td,i)=>setTimeout(()=>{td.classList.add("hupf");setTimeout(()=>td.classList.remove("hupf"),560);},t(i*280)));
  setTimeout(()=>{
    blase(o.teile.join(" + ")+" = "+o.summe);
    setTimeout(()=>{
      const r=$("r"+k); if(r) r.textContent=o.ziffer;
      document.querySelector("#gitter tr.erg").classList.add("gezeigt");
      const weiter=()=>{
        hilfeStufe++; zeichneStufenPunkte(); laeuft=false;
        if(hilfeStufe>=aufgabe.n){
          $("btn-hilfe").disabled=true;
          setTimeout(()=>{for(let i=0;i<aufgabe.n;i++) hellSpalte(i,false); blase("");},t(1400));
        }
        if(auto&&hilfeStufe<aufgabe.n) setTimeout(()=>hilfeSchritt(true),t(900));
      };
      if(o.carry>0&&k+1<aufgabe.n) flug($("r"+k),$("c"+(k+1)),String(o.carry),weiter);
      else setTimeout(weiter,t(700));
    },t(700));
  }, t(zellen.length*280+350));
}

function hilfeLuecke(){
  hilfeBenutzt=true;
  const k=aufgabe.lueckeSp, o=aufgabe.out[k];
  if(hilfeStufe===0){
    hellSpalte(k,true);
    const kf=$("k"+k); if(kf){kf.classList.add("an"); setTimeout(()=>kf.classList.remove("an"),t(1100));}
    blase(platzhalterGleichung(k));
    hilfeStufe=1; zeichneStufenPunkte();
  }else{
    const z=$("s"+aufgabe.lueckeZeile+"_"+aufgabe.lueckeSp);
    if(z){ z.textContent=aufgabe.lueckeZiffer; z.classList.remove("luecke"); }
    blase("");
    $("btn-hilfe").disabled=true;
    hilfeStufe=2; zeichneStufenPunkte();
  }
}
function platzhalterGleichung(k){
  const o=aufgabe.out[k], teile=[];
  if(o.carryIn) teile.push(o.carryIn);
  aufgabe.zahlen.forEach((z,i)=>{
    if(String(z).length<=k) return;
    teile.push( (i===aufgabe.lueckeZeile && k===aufgabe.lueckeSp) ? "?" : ziffer(z,k) );
  });
  return teile.join(" + ")+" = "+o.summe;
}

function hilfeFehler(){
  hilfeBenutzt=true;
  const k=aufgabe.fehlerSp, o=aufgabe.out[k];
  if(hilfeStufe===0){
    hellSpalte(k,true);
    const kf=$("k"+k); if(kf){kf.classList.add("an"); setTimeout(()=>kf.classList.remove("an"),t(1100));}
    hilfeStufe=1; zeichneStufenPunkte();
  }else{
    blase(o.teile.join(" + ")+" = "+o.summe);
    $("btn-hilfe").disabled=true;
    hilfeStufe=2; zeichneStufenPunkte();
  }
}

function zeichneStufenPunkte(){
  const max = aufgabe.art==="rechnen" ? aufgabe.n : 2;
  let h=""; for(let i=0;i<max;i++) h+=`<div class="sp ${i<hilfeStufe?'an':''}"></div>`;
  $("stufen-punkte").innerHTML=h;
}

/* ---------- Ablauf ---------- */
function neueAufgabe(){
  aufgabe=baueAufgabe(ARTEN[nr%ARTEN.length]);
  eingabe=""; hilfeStufe=0; hilfeBenutzt=false; laeuft=false;
  zeichneGitter(); zeichneStufenPunkte(); blase("");
  $("karte-ende").classList.add("verstecken");
  $("wahl").classList.add("verstecken");
  $("btn-hilfe").classList.remove("verstecken"); $("btn-hilfe").disabled=false;
  $("feld").className="feld"; $("feld").innerHTML="";

  const istFehler = aufgabe.art==="fehler";
  $("karte-eingabe").classList.toggle("verstecken", istFehler);
  $("block").classList.toggle("verstecken", istFehler);
  $("gleich").className = "gleich" + (istFehler?" such":"");
  $("marke").textContent = istFehler ? "Fehler finden" : (aufgabe.art==="luecke" ? "welche Ziffer fehlt?" : "");

  if(!istFehler){
    const heft=$("heft"); heft.classList.remove("schreibt"); void heft.offsetWidth; heft.classList.add("schreibt");
    tasten();
  }
  startZeit=Date.now();
  punkte();
}

function punkte(){
  let h="";
  for(let i=0;i<PRO_RUNDE;i++){
    const v=verlauf[i];
    h+=`<div class="punkt ${v==='ok'?'voll':''} ${v==='hilfe'?'hilfe':''} ${i===nr?'jetzt':''}"></div>`;
  }
  $("punkte").innerHTML=h;
  $("chip-stufe").textContent=STUFEN[stufe].titel;
  $("chip-hoch").classList.toggle("verstecken", !(schnellSerie>=SCHNELL_NOETIG && stufe<STUFEN.length-1));
  $("chip-hoch").classList.add("hoch");
}

function geschafft(){
  const dauer=Date.now()-startZeit;
  if(!hilfeBenutzt && dauer<SCHNELL_MS) schnellSerie++; else schnellSerie=0;
  verlauf[nr]=hilfeBenutzt?"hilfe":"ok";
  setTimeout(ende,900);
}

function pruefen(){
  const w=parseInt(eingabe,10);
  if(isNaN(w)) return;
  const f=$("feld");
  const soll = aufgabe.art==="luecke" ? aufgabe.lueckeZiffer : aufgabe.summe;
  if(w===soll){
    f.className="feld gut";
    if(aufgabe.art==="luecke"){
      const z=$("s"+aufgabe.lueckeZeile+"_"+aufgabe.lueckeSp);
      if(z){ z.textContent=aufgabe.lueckeZiffer; z.classList.remove("luecke"); }
    }else{
      aufgabe.out.forEach(o=>{const r=$("r"+o.k); if(r&&!r.textContent) r.textContent=o.ziffer;});
      document.querySelector("#gitter tr.erg").classList.add("gezeigt");
    }
    geschafft();
  }else{
    f.className="feld schlecht";
    setTimeout(()=>{
      eingabe=""; f.innerHTML=""; f.className="feld";
      zeigeWahl(true);
    },800);
  }
}

function zeigeWahl(an){
  $("wahl").classList.toggle("verstecken",!an);
  $("block").classList.toggle("verstecken",an);
  $("btn-hilfe").classList.toggle("verstecken",an);
}
$("wahl-nochmal").addEventListener("click",()=>{
  zeigeWahl(false);
  eingabe=""; $("feld").innerHTML=""; $("feld").className="feld";
});
$("wahl-hilfe").addEventListener("click",()=>{
  zeigeWahl(false);
  $("btn-hilfe").disabled=false;
  hilfeSchritt(false);
});

function tippeZelle(td){
  if(aufgabe.art!=="fehler") return;
  const k=+td.dataset.sp;
  if(k===aufgabe.fehlerSp){
    td.classList.add("treffer");
    setTimeout(()=>{
      td.textContent=aufgabe.out[k].ziffer;
      if(aufgabe.fehlerTyp==="uebertrag"){
        const c=$("c"+k); if(c) c.textContent=aufgabe.out[k-1].carry;
      }
      geschafft();
    },600);
  }else{
    td.classList.add("daneben");
    setTimeout(()=>td.classList.remove("daneben"),420);
  }
}

function ende(){
  nr++; punkte();
  $("karte-eingabe").classList.add("verstecken");
  $("block").classList.add("verstecken");
  $("btn-hilfe").classList.add("verstecken");
  $("wahl").classList.add("verstecken");
  $("karte-ende").classList.remove("verstecken");
  $("e-icon").textContent=hilfeBenutzt?"✓":"★";
  $("e-text").textContent = nr>=PRO_RUNDE ? verlauf.filter(v=>v==="ok").length+" von "+PRO_RUNDE+" ohne Hilfe" : "";
}

$("e-weiter").addEventListener("click",()=>{ if(nr>=PRO_RUNDE){ nr=0; verlauf=[]; } neueAufgabe(); });
$("btn-hilfe").addEventListener("click",()=>hilfeSchritt(false));
$("chip-stufe").addEventListener("click",()=>{ $("spiel").classList.add("verstecken"); $("start").classList.remove("verstecken"); });
$("chip-hoch").addEventListener("click",()=>{
  if(stufe<STUFEN.length-1) stufe++;
  schnellSerie=0; nr=0; verlauf=[];
  neueAufgabe();
});
$("z-los").addEventListener("click",()=>{ $("zwischen").classList.add("verstecken"); $("spiel").classList.remove("verstecken"); neueAufgabe(); });
$("z-zurueck").addEventListener("click",()=>{ $("zwischen").classList.add("verstecken"); $("start").classList.remove("verstecken"); });

/* ---------- Ziffernblock ---------- */
function tasten(){
  let h="";
  for(let i=1;i<=9;i++) h+=`<button class="taste" data-z="${i}">${i}</button>`;
  h+=`<button class="taste" data-z="0">0</button><button class="taste weg" data-a="weg">⌫</button>`;
  h+=`<button class="taste ok" data-a="ok">fertig</button>`;
  const b=$("block"); b.innerHTML=h;
  b.querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>{
    if(btn.dataset.z!==undefined) tippe(btn.dataset.z);
    else if(btn.dataset.a==="weg"){ eingabe=eingabe.slice(1); zeigeEingabe(); }
    else pruefen();
  }));
}
function zeigeEingabe(){
  const f=$("feld");
  if(!eingabe){ f.innerHTML=""; return; }
  const n=eingabe.length;
  let h='<div class="ziffern">';
  for(let i=0;i<n;i++){
    const stelle = aufgabe && aufgabe.art==="luecke" ? aufgabe.lueckeSp : (n-1-i);
    h+=`<div class="zbox sw${Math.min(stelle,5)}">${eingabe[i]}</div>`;
  }
  f.innerHTML=h+'</div>';
}
function tippe(z){
  const max = aufgabe && aufgabe.art==="luecke" ? 1 : 7;
  if(eingabe.length>=max) eingabe="";
  eingabe = z + eingabe;            // Einer zuerst: wächst nach links
  $("feld").className="feld";
  zeigeEingabe();
}
document.addEventListener("keydown",e=>{
  if($("spiel").classList.contains("verstecken")) return;
  if(e.key>="0"&&e.key<="9") tippe(e.key);
  else if(e.key==="Backspace"){ eingabe=eingabe.slice(1); zeigeEingabe(); }
  else if(e.key==="Enter") pruefen();
});

/* ---------- Tour: Schritt für Schritt ---------- */
let tourZahlen=[347,86], tourSchritte=[], tourNr=0, tourRech=null;

function tourGitter(){
  const r=spaltenRechnung(tourZahlen);
  const sp=[]; for(let k=r.n-1;k>=0;k--) sp.push(k);
  let h='<table class="rg" style="margin:0 auto"><tr><td class="op"></td>';
  sp.forEach(k=>h+=`<td class="kopfz sw${k}" id="tk${k}">${NAMEN[k]}</td>`);
  h+='</tr>';
  tourZahlen.forEach((z,i)=>{
    h+='<tr><td class="op">'+(i===0?"":"+")+'</td>';
    sp.forEach(k=>{ const leer=String(z).length<=k;
      h+=`<td class="zahl sw${k} ${leer?'leer':''}" id="t${i}_${k}">${leer?"":ziffer(z,k)}</td>`; });
    h+='</tr>';
  });
  h+='<tr><td class="op"></td>';
  sp.forEach(k=>h+=`<td class="ue ${r.out[k-1]&&r.out[k-1].carry?'box':''}" id="tc${k}"></td>`);
  h+='</tr><tr class="erg"><td class="op"></td>';
  sp.forEach(k=>h+=`<td class="zahl sw${k}" id="tr${k}"></td>`);
  h+='</tr></table><div id="tour-eingabe" style="margin-top:14px;display:flex;justify-content:center"></div>';
  $("tour-mini").innerHTML=h;
  return r;
}

function spot(el,wort){
  const S=$("spot"), W=$("spot-wort");
  if(!el){ S.classList.add("verstecken"); W.classList.add("verstecken"); return; }
  const r=el.getBoundingClientRect(), p=8;
  S.classList.remove("verstecken");
  S.style.left=(r.left-p)+"px"; S.style.top=(r.top-p)+"px";
  S.style.width=(r.width+2*p)+"px"; S.style.height=(r.height+2*p)+"px";
  if(wort){
    W.classList.remove("verstecken"); W.textContent=wort;
    W.style.left=(r.left+r.width/2-40)+"px";
    W.style.top=(r.top-38)+"px";
  } else W.classList.add("verstecken");
}
function spotReihe(von,bis,wort){
  const a=von.getBoundingClientRect(), b=bis.getBoundingClientRect();
  const kasten={getBoundingClientRect:()=>({
    left:Math.min(a.left,b.left), top:Math.min(a.top,b.top),
    width:Math.max(a.right,b.right)-Math.min(a.left,b.left),
    height:Math.max(a.bottom,b.bottom)-Math.min(a.top,b.top)})};
  spot(kasten,wort);
}
function hupfen(zellen){
  zellen.forEach((e,i)=>setTimeout(()=>{e.classList.add("hupf");setTimeout(()=>e.classList.remove("hupf"),560);},i*260));
}

function tourBauen(){
  const r=tourGitter(); tourRech=r;
  blase("",$("tour-blase"));
  const sp=[]; for(let k=r.n-1;k>=0;k--) sp.push(k);
  const schritte=[];

  schritte.push(()=>{ spotReihe($("tk"+sp[0]),$("tk0"),"Stellenwerte"); });
  schritte.push(()=>{
    const letzte=tourZahlen.length-1;
    spotReihe($("t0_"+sp[0]),$("t"+letzte+"_0"),"Summanden");
  });
  schritte.push(()=>{
    const ops=document.querySelectorAll("#tour-mini td.op");
    spot(ops[tourZahlen.length],"addieren");
  });

  for(let k=0;k<r.n;k++){
    const o=r.out[k];
    schritte.push(()=>{
      const zellen=[];
      if(o.carryIn){const c=$("tc"+k); if(c&&c.textContent) zellen.push(c);}
      tourZahlen.forEach((z,i)=>{ const e=$("t"+i+"_"+k); if(e&&e.textContent) zellen.push(e); });
      if(zellen.length) spotReihe(zellen[0],zellen[zellen.length-1],NAMEN[k]);
      hupfen(zellen);
      setTimeout(()=>blase(o.teile.join(" + ")+" = "+o.summe,$("tour-blase")),zellen.length*260+200);
    });
    schritte.push(()=>{
      const rz=$("tr"+k); if(rz) rz.textContent=o.ziffer;
      spot($("tr"+k),"hinschreiben");
    });
    if(o.carry>0 && k+1<r.n){
      schritte.push(()=>{
        flug($("tr"+k),$("tc"+(k+1)),String(o.carry),()=>spot($("tc"+(k+1)),"Übertrag"));
      });
    }
  }

  schritte.push(()=>{
    blase("",$("tour-blase"));
    spotReihe($("tr"+sp[0]),$("tr0"),"Ergebnis");
  });

  // Eingabe-Demo: Einer zuerst
  const zif=String(r.summe).split("");
  for(let i=zif.length-1;i>=0;i--){
    schritte.push(()=>{
      const teil=zif.slice(i).join("");
      let h='<div class="feld" style="min-width:auto"><div class="ziffern">';
      teil.split("").forEach((d,j)=>{ const stelle=teil.length-1-j;
        h+=`<div class="zbox sw${Math.min(stelle,5)}">${d}</div>`; });
      h+='</div></div>';
      $("tour-eingabe").innerHTML=h;
      spot($("tour-eingabe"), i===zif.length-1 ? "Einer zuerst" : "dann nach links");
    });
  }
  return schritte;
}

function tourWeiter(){
  if(tourNr>=tourSchritte.length){ spot(null); return; }
  tourSchritte[tourNr++]();
  $("tour-weiter").textContent = tourNr>=tourSchritte.length ? "fertig" : "weiter";
}

function tourSpulen(ziel){
  tourSchritte=tourBauen(); tourNr=0;
  tourSofort=true;
  for(let i=0;i<ziel;i++){ tourSchritte[i](); tourNr=i+1; }
  tourSofort=false;
  $("tour-weiter").textContent = tourNr>=tourSchritte.length ? "fertig" : "weiter";
}
function tourAuf(zahlen){
  tourZahlen = zahlen || tourZahlen;
  $("tour").classList.remove("verstecken");
  tourSchritte=tourBauen(); tourNr=0;
  $("tour-weiter").textContent="weiter";
  spot(null);
}

$("btn-beispiel").addEventListener("click",()=>tourAuf([347,86]));
$("z-wie").addEventListener("click",()=>{ const a=roheAufgabe(); tourAuf(a.zahlen); });
$("chip-tour").addEventListener("click",()=>{ const a=roheAufgabe(); tourAuf(a.zahlen); });
$("tour-weiter").addEventListener("click",tourWeiter);
$("tour-zurueck").addEventListener("click",()=>{ if(tourNr>0) tourSpulen(tourNr-1); });
$("tour-nochmal").addEventListener("click",()=>tourAuf(tourZahlen));
$("tour-neu").addEventListener("click",()=>{ const a=roheAufgabe(); tourAuf(a.zahlen); });
$("tour-zu").addEventListener("click",()=>{ $("tour").classList.add("verstecken"); spot(null); });

zeichneStart();
})();
</script>
