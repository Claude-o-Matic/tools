<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripel-Dreieck</title>
<style>
  :root {
    --bg: #f6f5f1; --ink: #1b1b1b; --muted: #6b6b6b;
    --blau: #4f86c6; --orange: #e8730c; --c: #5b4a8b;
    --gruen: #2e9d4f; --rot: #d33b2f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: row; }
  #regler { width: 360px; flex: none; padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 24px; margin: 0 0 4px 0; }
  .zeile { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; }
  .kopf { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .name { font-size: 26px; font-weight: 800; }
  .gamma { border-width: 3px; }
  .gamma .wert { font-size: 44px; }
  .gamma.recht { border-color: var(--gruen); color: var(--gruen); background: #eef7f0; }
  .gamma.weg .wert { color: var(--rot); font-size: 26px; }
  .wert { font-size: 34px; font-weight: 800; min-width: 2ch; text-align: right; }
  .steuer { display: flex; align-items: center; gap: 10px; }
  .steuer button { width: 46px; height: 46px; flex: none; border-radius: 10px; border: 2px solid var(--ink);
    background: #fff; font-size: 26px; font-weight: 700; color: var(--ink); cursor: pointer; touch-action: manipulation; }
  .steuer button:active { background: #e8e8e8; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 5px;
    background: #ddd; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%;
    background: var(--farbe); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--ink); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: var(--farbe);
    border: 3px solid #fff; box-shadow: 0 0 0 2px var(--ink); cursor: pointer; }
  #flaeche { position: relative; flex: 1; min-width: 0; }
  svg { width: 100%; height: 100%; display: block; }
  @media (max-width: 820px), (max-aspect-ratio: 1/1) {
    body { flex-direction: column; }
    #regler { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 10px; padding: 12px; }
    h1 { width: 100%; }
    .zeile { flex: 1 1 220px; }
  }
</style>
</head>
<body>
<div id="regler">
  <h1>Tripel-Dreieck</h1>
  <div class="zeile" style="--farbe: var(--blau)">
    <div class="kopf"><span class="name" style="color:var(--blau)">a</span><span class="wert" id="wa">3</span></div>
    <div class="steuer"><button data-s="a" data-d="-1">−</button><input type="range" id="a" min="1" max="30" step="1" value="3"><button data-s="a" data-d="1">+</button></div>
  </div>
  <div class="zeile" style="--farbe: var(--orange)">
    <div class="kopf"><span class="name" style="color:var(--orange)">b</span><span class="wert" id="wb">4</span></div>
    <div class="steuer"><button data-s="b" data-d="-1">−</button><input type="range" id="b" min="1" max="30" step="1" value="4"><button data-s="b" data-d="1">+</button></div>
  </div>
  <div class="zeile" style="--farbe: var(--c)">
    <div class="kopf"><span class="name" style="color:var(--c)">c</span><span class="wert" id="wc">6</span></div>
    <div class="steuer"><button data-s="c" data-d="-1">−</button><input type="range" id="c" min="1" max="30" step="1" value="6"><button data-s="c" data-d="1">+</button></div>
  </div>
  <div class="zeile gamma" id="gbox"><div class="kopf"><span class="name">γ</span><span class="wert" id="wg">90,0°</span></div></div>
</div>
<div id="flaeche"><svg id="svg"></svg></div>

<script>
const $ = id => document.getElementById(id);
const R = { a: $('a'), b: $('b'), c: $('c') };
const svg = $('svg');
const NS = 'http://www.w3.org/2000/svg';
const FARBE = { a: '#4f86c6', b: '#e8730c', c: '#5b4a8b', gruen: '#2e9d4f', rot: '#d33b2f', ink: '#1b1b1b' };
const komma = x => x.toFixed(1).replace('.', ',');

document.querySelectorAll('.steuer button').forEach(bt => bt.addEventListener('click', () => {
  const r = R[bt.dataset.s];
  r.value = Math.max(1, Math.min(30, +r.value + +bt.dataset.d));
  zeichnen();
}));
Object.values(R).forEach(r => r.addEventListener('input', zeichnen));
window.addEventListener('resize', zeichnen);

function mk(tag, attr, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attr) e.setAttribute(k, attr[k]);
  if (text !== undefined) e.textContent = text;
  svg.appendChild(e); return e;
}

function zeichnen() {
  const a = +R.a.value, b = +R.b.value, c = +R.c.value;
  $('wa').textContent = a; $('wb').textContent = b; $('wc').textContent = c;
  svg.innerHTML = '';
  const W = svg.clientWidth, H = svg.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const ok = a + b > c && a + c > b && b + c > a;
  if (ok) dreieck(a, b, c, W, H); else keinDreieck(a, b, c, W, H);
}

// Einpassen: Weltpunkte -> Bildschirm
function einpassen(pts, W, H, rand) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const k = Math.min((W - 2 * rand) / Math.max(maxX - minX, 1e-6), (H - 2 * rand) / Math.max(maxY - minY, 1e-6));
  const ox = (W - (maxX - minX) * k) / 2 - minX * k;
  const oy = (H + (maxY - minY) * k) / 2 + minY * k;
  return { k, f: p => [ox + p[0] * k, oy - p[1] * k] };
}

function seitenLabel(P, Q, innen, text, farbe, fs) {
  const mx = (P[0] + Q[0]) / 2, my = (P[1] + Q[1]) / 2;
  let nx = -(Q[1] - P[1]), ny = Q[0] - P[0];
  const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
  if ((innen[0] - mx) * nx + (innen[1] - my) * ny > 0) { nx = -nx; ny = -ny; }
  const d = fs * 0.85 + Math.abs(nx) * text.length * fs * 0.3;
  mk('text', { x: mx + nx * d, y: my + ny * d + fs * 0.35, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': 800, fill: farbe }, text);
}

function dreieck(a, b, c, W, H) {
  const cosG = Math.max(-1, Math.min(1, (a * a + b * b - c * c) / (2 * a * b)));
  const g = Math.acos(cosG);
  const recht = a * a + b * b === c * c;
  // C im Ursprung, A auf der x-Achse (Seite b), B unter Winkel γ (Seite a)
  const C = [0, 0], A = [b, 0], Bp = [a * Math.cos(g), a * Math.sin(g)];
  const fs = Math.max(20, Math.min(34, Math.min(W, H) / 22));
  const { f } = einpassen([C, A, Bp], W, H, fs * 3.2);
  const c0 = f(C), a0 = f(A), b0 = f(Bp);
  const S = [(c0[0] + a0[0] + b0[0]) / 3, (c0[1] + a0[1] + b0[1]) / 3];
  mk('polygon', { points: [c0, a0, b0].map(p => p.join(',')).join(' '), fill: recht ? 'rgba(46,157,79,.08)' : 'rgba(0,0,0,.03)', stroke: 'none' });
  // Winkel γ
  const rW = Math.max(28, Math.min(70, Math.min(W, H) / 9));
  if (recht) {
    const u = [ (a0[0] - c0[0]), (a0[1] - c0[1]) ], v = [ (b0[0] - c0[0]), (b0[1] - c0[1]) ];
    const lu = Math.hypot(...u), lv = Math.hypot(...v), q = rW * 0.7;
    const p1 = [c0[0] + u[0] / lu * q, c0[1] + u[1] / lu * q], p3 = [c0[0] + v[0] / lv * q, c0[1] + v[1] / lv * q];
    const p2 = [p1[0] + v[0] / lv * q, p1[1] + v[1] / lv * q];
    mk('polygon', { points: [c0, p1, p2, p3].map(p => p.join(',')).join(' '), fill: 'rgba(46,157,79,.25)', stroke: FARBE.gruen, 'stroke-width': 3 });
    mk('circle', { cx: c0[0] + (u[0] / lu + v[0] / lv) * q * 0.5, cy: c0[1] + (u[1] / lu + v[1] / lv) * q * 0.5, r: 3.5, fill: FARBE.gruen });
  } else {
    const p1 = [c0[0] + rW, c0[1]];
    const p2 = [c0[0] + rW * Math.cos(g), c0[1] - rW * Math.sin(g)];
    mk('path', { d: `M ${c0[0]} ${c0[1]} L ${p1[0]} ${p1[1]} A ${rW} ${rW} 0 0 0 ${p2[0]} ${p2[1]} Z`, fill: 'rgba(27,27,27,.10)', stroke: FARBE.ink, 'stroke-width': 2 });
  }
  // Seiten
  const sw = Math.max(5, Math.min(8, fs / 4));
  mk('line', { x1: c0[0], y1: c0[1], x2: a0[0], y2: a0[1], stroke: FARBE.b, 'stroke-width': sw, 'stroke-linecap': 'round' });
  mk('line', { x1: c0[0], y1: c0[1], x2: b0[0], y2: b0[1], stroke: FARBE.a, 'stroke-width': sw, 'stroke-linecap': 'round' });
  mk('line', { x1: a0[0], y1: a0[1], x2: b0[0], y2: b0[1], stroke: FARBE.c, 'stroke-width': sw, 'stroke-linecap': 'round' });
  [c0, a0, b0].forEach(p => mk('circle', { cx: p[0], cy: p[1], r: sw * 0.9, fill: FARBE.ink }));
  seitenLabel(c0, a0, S, `b = ${b}`, FARBE.b, fs);
  seitenLabel(c0, b0, S, `a = ${a}`, FARBE.a, fs);
  seitenLabel(a0, b0, S, `c = ${c}`, FARBE.c, fs);
  // γ: Buchstabe im Winkel, Zahl in der Anzeige links
  const bis = [Math.cos(g / 2), -Math.sin(g / 2)];
  const d = rW + fs * 0.9;
  mk('text', { x: c0[0] + bis[0] * d, y: c0[1] + bis[1] * d + fs * 0.35, 'text-anchor': 'middle', 'font-size': fs, 'font-weight': 800,
    fill: recht ? FARBE.gruen : FARBE.ink }, 'γ');
  $('wg').textContent = `${komma(g * 180 / Math.PI)}°`;
  $('gbox').className = 'zeile gamma' + (recht ? ' recht' : '');
}

function keinDreieck(a, b, c, W, H) {
  // längste Seite als Grundseite, die beiden anderen klappen von den Enden hoch und erreichen sich nicht
  const s = [['a', a], ['b', b], ['c', c]].sort((x, y) => y[1] - x[1]);
  const [L, P, Q] = s;
  const neig = 35 * Math.PI / 180;
  const A = [0, 0], B = [L[1], 0];
  const Pend = [P[1] * Math.cos(neig), P[1] * Math.sin(neig)];
  const Qend = [L[1] - Q[1] * Math.cos(neig), Q[1] * Math.sin(neig)];
  const fs = Math.max(20, Math.min(34, Math.min(W, H) / 22));
  const { f } = einpassen([A, B, Pend, Qend, [L[1] / 2, L[1] * 0.35]], W, H, fs * 3.2);
  const a0 = f(A), b0 = f(B), p0 = f(Pend), q0 = f(Qend);
  const sw = Math.max(5, Math.min(8, fs / 4));
  const lin = (u, v, n) => mk('line', { x1: u[0], y1: u[1], x2: v[0], y2: v[1], stroke: FARBE[n], 'stroke-width': sw, 'stroke-linecap': 'round' });
  lin(a0, b0, L[0]); lin(a0, p0, P[0]); lin(b0, q0, Q[0]);
  const innen = [(a0[0] + b0[0]) / 2, (a0[1] + b0[1]) / 2 - 2000];
  seitenLabel(a0, b0, innen, `${L[0]} = ${L[1]}`, FARBE[L[0]], fs);
  seitenLabel(a0, p0, [b0[0], b0[1]], `${P[0]} = ${P[1]}`, FARBE[P[0]], fs);
  seitenLabel(b0, q0, [a0[0], a0[1]], `${Q[0]} = ${Q[1]}`, FARBE[Q[0]], fs);
  mk('text', { x: W / 2, y: Math.min(a0[1] + fs * 3.2, H - 10), 'text-anchor': 'middle', 'font-size': fs * 1.15, 'font-weight': 800, fill: FARBE.rot }, 'kein Dreieck');
  $('wg').textContent = 'kein Dreieck';
  $('gbox').className = 'zeile gamma weg';
}

zeichnen();
</script>
</body>
</html>
