<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abschluss-Reflexion</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #21527a;
    --accent: #4a9ede;
    --card: #ffffff;
    --ink: #1a1a1a;
    --muted: #555;
    --grid: #c9dfae;
    --net: #6a9a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 32px 24px 40px; }
  h1 {
    font-family: "Roboto Slab", Georgia, serif;
    font-weight: 400;
    color: #fff;
    font-size: clamp(2rem, 5vw, 3.6rem);
    margin: 0 0 10px;
  }
  .bar { width: 70px; height: 6px; background: var(--accent); margin-bottom: 28px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    align-items: stretch;
  }
  .card { background: var(--card); padding: 22px 26px; }
  .item { margin-bottom: 26px; }
  .item:last-child { margin-bottom: 4px; }
  .label { font-size: 15px; line-height: 1.25; margin-bottom: 8px; }
  .scale { position: relative; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 28px; background: transparent; margin: 0; cursor: pointer;
    position: relative; z-index: 2;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 5px; background: var(--c); border-radius: 3px; }
  input[type=range]::-moz-range-track { height: 5px; background: var(--c); border-radius: 3px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 4px solid var(--c); margin-top: -8.5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 4px solid var(--c);
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ticks {
    position: absolute; left: 11px; right: 11px; top: 7px; height: 14px;
    display: flex; justify-content: space-between; pointer-events: none; z-index: 1;
  }
  .ticks span { width: 2px; height: 14px; background: var(--c); opacity: .55; }
  .poles { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .radarCard { display: flex; align-items: center; justify-content: center; }
  #radar { width: 100%; height: auto; max-width: 620px; display: block; }
  .actions { margin-top: 22px; display: flex; justify-content: flex-end; }
  button {
    font: inherit; font-size: 15px; font-weight: 600;
    background: #63893c; color: #fff; border: 0; padding: 12px 20px; cursor: pointer;
    border-radius: 3px;
  }
  button:hover { background: #557a32; }
  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; }
    .wrap { padding: 24px 16px 32px; }
    .actions { justify-content: stretch; }
    .actions button { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Abschluss-Reflexion:</h1>
  <div class="bar"></div>
  <div class="grid">
    <div class="card" id="sliders"></div>
    <div class="card radarCard"><canvas id="radar" width="620" height="500"></canvas></div>
  </div>
  <div class="actions"><button id="save">Als Bild speichern</button></div>
</div>

<script>
const ITEMS = [
  { label: "Empfundener Arbeitsaufwand für Lehrkräfte", lo: "hoch", hi: "gering", axis: "Arbeitsaufwand", color: "#3f73b0" },
  { label: "Passung zum Curriculum", lo: "schlecht", hi: "gut", axis: "Curriculum-Passung", color: "#b5b83c" },
  { label: "Gerechtigkeit der Leistungsbewertung", lo: "ungerecht", hi: "gerecht", axis: "Gerechtigkeit", color: "#d07fc4" },
  { label: "Sinnstiftung für Schülerinnen und Schüler", lo: "gering", hi: "hoch", axis: "Sinnstiftung", color: "#8a64b8" },
  { label: "Unsicherheit bezogen auf die Umsetzung", lo: "groß", hi: "klein", axis: "Unsicherheit", color: "#4f9a3e" }
];
const STEPS = 7;
const values = ITEMS.map(() => 4);

// Regler aufbauen
const box = document.getElementById("sliders");
ITEMS.forEach((it, i) => {
  const d = document.createElement("div");
  d.className = "item";
  d.style.setProperty("--c", it.color);
  d.innerHTML = `
    <div class="label">${it.label}</div>
    <div class="scale">
      <div class="ticks">${"<span></span>".repeat(STEPS)}</div>
      <input type="range" min="1" max="${STEPS}" step="1" value="${values[i]}" aria-label="${it.label}">
    </div>
    <div class="poles"><span>${it.lo}</span><span>${it.hi}</span></div>`;
  d.querySelector("input").addEventListener("input", e => { values[i] = +e.target.value; drawScreen(); });
  box.appendChild(d);
});

// Netzdiagramm
function drawRadar(ctx, cx, cy, r, font) {
  const n = ITEMS.length;
  const ang = k => -Math.PI / 2 + k * 2 * Math.PI / n;
  const pt = (k, f) => [cx + Math.cos(ang(k)) * r * f, cy + Math.sin(ang(k)) * r * f];

  ctx.lineWidth = 1;
  ctx.strokeStyle = "#cfe3b6";
  for (let s = 1; s <= STEPS; s++) {
    ctx.beginPath();
    for (let k = 0; k < n; k++) { const [x, y] = pt(k, s / STEPS); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath(); ctx.stroke();
  }
  ctx.strokeStyle = "#9fc475";
  for (let k = 0; k < n; k++) { const [x, y] = pt(k, 1); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke(); }

  // Werte
  ctx.beginPath();
  values.forEach((v, k) => { const [x, y] = pt(k, v / STEPS); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath();
  ctx.fillStyle = "rgba(99,137,60,0.30)"; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = "#4f7a2a"; ctx.stroke();
  values.forEach((v, k) => {
    const [x, y] = pt(k, v / STEPS);
    ctx.beginPath(); ctx.arc(x, y, 5, 0, 2 * Math.PI);
    ctx.fillStyle = ITEMS[k].color; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "#fff"; ctx.stroke();
  });

  // Achsenbeschriftung
  ctx.fillStyle = "#1a1a1a"; ctx.font = font;
  for (let k = 0; k < n; k++) {
    const [x, y] = pt(k, 1.1);
    const c = Math.cos(ang(k)), s = Math.sin(ang(k));
    ctx.textAlign = Math.abs(c) < 0.2 ? "center" : (c > 0 ? "left" : "right");
    ctx.textBaseline = s < -0.5 ? "bottom" : (s > 0.5 ? "top" : "middle");
    ctx.fillText(ITEMS[k].axis, x, y);
  }
}

const cv = document.getElementById("radar");
function drawScreen() {
  const dpr = window.devicePixelRatio || 1;
  const W = 620, H = 500;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawRadar(ctx, W / 2, H / 2 + 20, 170, "14px system-ui, Arial, sans-serif");
}
drawScreen();

// Export als PNG
function wrap(ctx, text, maxW) {
  const words = text.split(" "), lines = []; let line = "";
  words.forEach(w => { const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
  lines.push(line); return lines;
}
document.getElementById("save").addEventListener("click", () => {
  const W = 1600, H = 820, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#21527a"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff"; ctx.font = '64px "Roboto Slab", Georgia, serif';
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("Abschluss-Reflexion:", 60, 110);
  ctx.fillStyle = "#4a9ede"; ctx.fillRect(60, 135, 80, 7);

  // linkes Panel
  const lx = 40, ly = 190, lw = 740, lh = 580;
  ctx.fillStyle = "#fff"; ctx.fillRect(lx, ly, lw, lh);
  const tx0 = lx + 250, tx1 = lx + lw - 40, rowH = lh / ITEMS.length;
  ITEMS.forEach((it, i) => {
    const y = ly + rowH * i + rowH / 2;
    ctx.fillStyle = "#1a1a1a"; ctx.font = "20px system-ui, Arial, sans-serif";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    const lines = wrap(ctx, it.label, 220);
    lines.forEach((l, j) => ctx.fillText(l, lx + 20, y - (lines.length - 1) * 12 + j * 24));
    ctx.strokeStyle = it.color; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(tx0, y); ctx.lineTo(tx1, y); ctx.stroke();
    ctx.lineWidth = 2;
    for (let s = 0; s < STEPS; s++) {
      const x = tx0 + (tx1 - tx0) * s / (STEPS - 1);
      ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.lineTo(x, y + 9); ctx.stroke();
    }
    const vx = tx0 + (tx1 - tx0) * (values[i] - 1) / (STEPS - 1);
    ctx.beginPath(); ctx.arc(vx, y, 12, 0, 2 * Math.PI);
    ctx.fillStyle = "#fff"; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = it.color; ctx.stroke();
    ctx.fillStyle = "#555"; ctx.font = "16px system-ui, Arial, sans-serif"; ctx.textBaseline = "top";
    ctx.textAlign = "left"; ctx.fillText(it.lo, tx0, y + 18);
    ctx.textAlign = "right"; ctx.fillText(it.hi, tx1, y + 18);
  });

  // rechtes Panel
  const rx = 820, ry = 190, rw = 740, rh = 580;
  ctx.fillStyle = "#fff"; ctx.fillRect(rx, ry, rw, rh);
  drawRadar(ctx, rx + rw / 2, ry + rh / 2 + 25, 160, "20px system-ui, Arial, sans-serif");

  const a = document.createElement("a");
  a.download = "abschluss-reflexion.png";
  a.href = c.toDataURL("image/png");
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
</body>
</html>
